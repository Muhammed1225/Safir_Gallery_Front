<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Safir Gallery | Səbətim</title>
    <link rel="stylesheet" href="basket.css">
</head>

<body>

    <nav class="navbar">
        <h1><a href="client.html">Safir Gallery</a></h1>
        <div class="links">
            <a href="client.html#about">Haqqımızda</a>
            <a href="client.html#goods">Məhsullar</a>
            <a href="basket.html" class="active">Səbətim</a>
        </div>
    </nav>

    <section id="home" class="home">
        <div class="text-box">
            <h2><i class="fa-solid fa-cart-shopping"></i> Səbətim</h2>
            <p>Xüsusi anlar üçün xüsusi buketlər</p>
            <button class="btn"><a href="#basket">Məhsullar</a></button>
        </div>
    </section>

    <section class="basket" id="basket">
        <div class="form">
            <form id="basket-form">
                <div class="form-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="name" name="name" placeholder="Adınız" required>
                </div>

                <div class="form-group">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="phone" name="phone" placeholder="Telefon" required>
                </div>

                <label for="product">Çatdırılma Tarixi:</label>
                <div class="form-group2" id="date-options"></div>
                <p id="error">Zəhmət olmasa tarix seçin!</p>
                <button class="btn order" type="submit">Sipariş et</button>
            </form>
        </div>

        <div class="goods">
            <h2>Səbətiimdəki Məhsullar</h2>
            <div class="goods-container" id="basket-container"></div>
        </div>
    </section>


    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="basket.js"></script>

</body>

</html>
