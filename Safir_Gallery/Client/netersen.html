<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Safir</title>
  <style>
    .container {
      margin-top: 20px;
    }

    .card img {
      height: 400px;
      width: 100%;
      object-fit: cover;
    }

    body {
      background-color: black;
    }

    .card:hover {
      transform: scale(1.02);
    }

    #sidebar {
      position: fixed;
      left: -250px;
      top: 0;
      width: 250px;
      height: 100%;
      background-color: #333;
      color: white;
      padding: 20px;
      transition: left 0.3s;
      z-index: 1000;
    }

    #sidebar.open {
      left: 0;
    }

    #toggleSidebar {
      position: fixed;
      left: 10px;
      bottom: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      z-index: 1100;
    }

    #toggleCart {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1200;
    }

    #searchBox {
      width: 100%;
      padding: 5px;
      margin-bottom: 10px;
    }

    #cart {
      position: fixed;
      right: 10px;
      top: 100px;
      width: 300px;
      background-color: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      display: none;
      z-index: 1000;
    }

    #cart.open {
      display: block;
    }

    #cart ul {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0;
      list-style: none;
    }

    #cart ul li {
      background-color: #e9ecef;
      border-radius: 5px;
      padding: 5px;
      text-align: center;
    }

    #cart ul li img {
      margin-right: 10px;
    }

    #cart .siparisEtButton {
      margin-top: 20px;
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      cursor: pointer;
      border-radius: 5px;
    }

    #cart .siparisEtButton:hover {
      background-color: #218838;
    }

    #closeCartBtn {
      position: absolute;
      top: 5px;
      right: 10px;
      font-size: 22px;
      color: #333;
      cursor: pointer;
      font-weight: bold;
    }

    #closeCartBtn:hover {
      color: red;
    }

    .remove-item {
      position: absolute;
      top: 5px;
      right: 5px;
      color: red;
      font-weight: bold;
      cursor: pointer;
      font-size: 20px;
    }

    .category-bubble {
      display: none;
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #ffc107;
      color: black;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 12px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      z-index: 10;
      opacity: 0;
    }

    .category-bubble.show {
      display: block;
      animation: showBubble 0.3s ease-out forwards;
    }

    .category-bubble.hide {
      animation: hideBubble 0.3s ease-in forwards;
    }

    @keyframes showBubble {
      0% {
        transform: scale(0.5) translateX(-50%) translateY(-10px);
        opacity: 0;
      }
      100% {
        transform: scale(1) translateX(-50%) translateY(0);
        opacity: 1;
      }
    }

    @keyframes hideBubble {
      0% {
        transform: scale(1) translateX(-50%) translateY(0);
        opacity: 1;
      }
      100% {
        transform: scale(0.5) translateX(-50%) translateY(-10px);
        opacity: 0;
      }
    }

    .card-title-container {
      position: relative;
      display: inline-block;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="toggleSidebar">&gt;</button>
  <button id="toggleCart" class="btn btn-warning">Sepete Git</button>

  <div id="sidebar">
    <h3>Menü</h3>
    <input type="text" id="searchBox" placeholder="Çiçek ara..." onkeyup="searchFlowers()">
    <ul>
      <li><a href="#" style="color: white;">Ana Sayfa</a></li>
      <li><a href="#" style="color: white;">Toy xoncalari</a></li>
      <li><a href="#" style="color: white;">Bayram xoncalari</a></li>
      <li><a href="#" style="color: white;">Baby shower gift box</a></li>
      <li><a href="#" style="color: white;">Ramazan xoncasi</a></li>
      <li><a href="#" style="color: white;">Kişi gift boxu</a></li>
      <li><a href="#" style="color: white;">Qadın gift boxu</a></li>
      <li><a href="#" style="color: white;">Müəllim gift boxu</a></li>
      <li><a href="#" style="color: white;">Uşaq gift boxu</a></li>
      <li><a href="#" style="color: white;">Ad günü giftbox</a></li>
      <li><a href="#" style="color: white;">Sünnet xoncasi</a></li>
      <li><a href="#" style="color: white;">Bəy xoncası</a></li>
      <li><a href="#" style="color: white;" aria-selected="true">Xına xoncalari</a></li>
    </ul>
  </div>

  <div class="container">
    <h1 class="text-center text-white">Safir</h1>
    <div class="row" id="flowerContainer"></div>
  </div>

  <div id="cart">
    <div id="closeCartBtn" onclick="closeCart()">×</div>
    <h3>Sepet</h3>
    <ul id="cartItems"></ul>
    <button class="siparisEtButton" onclick="siparisVer()">Sipariş Et</button>
  </div>

  <script>
    const flowers = [
      { id: 1, name: "Gül Buketi", price: 50, img: "https://via.placeholder.com/200", category: "Toy xoncalari" },
      { id: 2, name: "Papatya Buketi", price: 40, img: "https://via.placeholder.com/200", category: "Bayram xoncalari" },
      { id: 3, name: "Lale Buketi", price: 60, img: "https://via.placeholder.com/200", category: "Xına xoncalari" }
    ];

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function renderFlowers() {
      const container = document.getElementById("flowerContainer");
      container.innerHTML = "";
      flowers.forEach(flower => {
        container.innerHTML += `
          <div class="col-md-4 mb-3">
            <div class="card">
              <img src="${flower.img}" class="card-img-top" alt="${flower.name}">
              <div class="card-body">
                <div class="card-title-container"
                  onmousedown="startHold(${flower.id})"
                  onmouseup="clearHold(${flower.id})"
                  ontouchstart="startHold(${flower.id})"
                  ontouchend="clearHold(${flower.id})">
                  <h5 class="card-title">${flower.name}</h5>
                  <div class="category-bubble" id="category-${flower.id}">${flower.category}</div>
                </div>
                <p class="card-text">Fiyat: ${flower.price} TL</p>
                <button class="btn btn-primary" onclick="addToCart(${flower.id})">Sepete Ekle</button>
              </div>
            </div>
          </div>`;
      });
    }

    function addToCart(id) {
      const flower = flowers.find(f => f.id === id);
      cart.push(flower);
      localStorage.setItem("cart", JSON.stringify(cart));
      updateCart();
    }

    function updateCart() {
      const cartList = document.getElementById("cartItems");
      cartList.innerHTML = "";
      cart.forEach((item, index) => {
        cartList.innerHTML += `
          <li style="position: relative;">
            <span class="remove-item" onclick="removeFromCart(${index})">×</span>
            <img src="${item.img}" alt="${item.name}" style="width: 100%; height: auto; border-radius: 5px;">
            <div style="font-size: 14px; margin-top: 5px; color: #333;">${item.price} TL</div>
          </li>`;
      });
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      localStorage.setItem("cart", JSON.stringify(cart));
      updateCart();
    }

    function closeCart() {
      const cartElement = document.getElementById("cart");
      cartElement.classList.remove("open");
      cartElement.style.display = "none";
    }

    function searchFlowers() {
      const searchValue = document.getElementById("searchBox").value.toLowerCase();
      const container = document.getElementById("flowerContainer");
      container.innerHTML = "";
      flowers.filter(flower => flower.name.toLowerCase().includes(searchValue)).forEach(flower => {
        container.innerHTML += `
          <div class="col-md-4 mb-3">
            <div class="card">
              <img src="${flower.img}" class="card-img-top" alt="${flower.name}">
              <div class="card-body">
                <div class="card-title-container"
                  onmousedown="startHold(${flower.id})"
                  onmouseup="clearHold(${flower.id})"
                  ontouchstart="startHold(${flower.id})"
                  ontouchend="clearHold(${flower.id})">
                  <h5 class="card-title">${flower.name}</h5>
                  <div class="category-bubble" id="category-${flower.id}">${flower.category}</div>
                </div>
                <p class="card-text">Fiyat: ${flower.price} TL</p>
                <button class="btn btn-primary" onclick="addToCart(${flower.id})">Sepete Ekle</button>
              </div>
            </div>
          </div>`;
      });
    }

    document.getElementById("toggleSidebar").addEventListener("click", function () {
      const sidebar = document.getElementById("sidebar");
      sidebar.classList.toggle("open");
      this.innerHTML = sidebar.classList.contains("open") ? "&lt;" : "&gt;";
    });

    document.getElementById("toggleCart").addEventListener("click", function () {
      const cartElement = document.getElementById("cart");
      cartElement.classList.toggle("open");
      if (cartElement.classList.contains("open")) {
        cartElement.style.display = "block";
      } else {
        cartElement.style.display = "none";
      }
    });

    function siparisVer() {
      window.location.href = "https://www.siparis.com";
    }

    let holdTimer = null;

    function startHold(id) {
      clearTimeout(holdTimer);
      holdTimer = setTimeout(() => {
        const bubble = document.getElementById(`category-${id}`);
        bubble.classList.remove("hide");
        bubble.classList.add("show");

        setTimeout(() => {
          bubble.classList.remove("show");
          bubble.classList.add("hide");
        }, 2000);
      }, 2000);
    }

    function clearHold(id) {
      clearTimeout(holdTimer);
    }

    renderFlowers();
    updateCart();
  </script>
</body>
</html>
